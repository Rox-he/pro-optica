<section id="nosotros" class="section-oc section-dark resumen-oc">
  <div class="container nr-grid">
    <div class="nr-text">
      <p class="eyebrow-oc">Quiénes somos</p>
      <h2>Centro de atención visual en Querétaro</h2>
      <p class="nr-sub">Accesibilidad, calidad y compromiso con nuestra comunidad — conoce nuestra misión, visión y a Nacho, nuestro mascota.</p>
      <a routerLink="/nosotros" class="btn-oc-outline">Conócenos más →</a>
    </div>
    <div class="nr-counters">
      <app-contador [target]="500" label="pacientes atendidos"></app-contador>
      <app-contador [target]="20" label="marcas disponibles"></app-contador>
      <app-contador [target]="2" label="sucursales en Querétaro"></app-contador>
    </div>
  </div>
</section>
