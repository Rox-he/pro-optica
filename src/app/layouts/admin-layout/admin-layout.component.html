<div class="admin-shell" [class.sidebar-collapsed]="!sidebarAbierto" *ngIf="usuario">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <a routerLink="/" class="sidebar-brand">
      <span class="brand-icon">
        <img src="/images/logo.png" alt="Óptica Convicción" class="brand-logo-img">
      </span>
      <span class="brand-text">Óptica Convicción</span>
    </a>

    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems"
         [routerLink]="item.ruta"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}"
         class="nav-item"
         [hidden]="!itemVisible(item)">

        <span class="nav-icon" [ngSwitch]="item.icon">
          <!-- Mi perfil -->
          <svg *ngSwitchCase="'perfil'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <!-- Gestión de usuarios -->
          <svg *ngSwitchCase="'usuarios'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <!-- Editar contenido -->
          <svg *ngSwitchCase="'editor'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
          </svg>
          <!-- Productos -->
          <svg *ngSwitchCase="'productos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <!-- Citas -->
          <svg *ngSwitchCase="'citas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <!-- Genérico / futuro -->
          <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </span>

        <span class="nav-label">{{ item.label }}</span>
      </a>

      <div class="nav-divider"></div>

      <a routerLink="/" class="nav-item nav-item-muted">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/>
          </svg>
        </span>
        <span class="nav-label">Volver al sitio</span>
      </a>
    </nav>

    <button class="sidebar-logout" (click)="cerrarSesion()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
      </span>
      <span class="nav-label">Cerrar sesión</span>
    </button>
  </aside>

  <!-- Contenido -->
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="topbar-toggle" (click)="toggleSidebar()" aria-label="Alternar menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h18"/>
          <path d="M3 6h18"/>
          <path d="M3 18h18"/>
        </svg>
      </button>
      <div class="topbar-user">
        <span class="topbar-avatar">{{ usuario.nombre[0].toUpperCase() }}</span>
        <div class="topbar-user-info">
          <span class="topbar-name">{{ usuario.nombre }}</span>
          <span class="topbar-role">{{ usuario.rol }}</span>
        </div>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
