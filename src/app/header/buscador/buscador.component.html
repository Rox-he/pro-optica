<div class="buscador-oc" [class.abierto]="abierto">
  <button class="buscador-icono" (click)="toggle()" aria-label="Buscar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  </button>

  <div class="buscador-panel" *ngIf="abierto">
    <form class="buscador-form" (ngSubmit)="buscar()">
      <input type="text" [(ngModel)]="query" name="q" (ngModelChange)="onInput()"
             placeholder="Buscar productos, marcas..." autofocus autocomplete="off">
      <button type="submit">Buscar</button>
    </form>

    <div class="buscador-sugerencias" *ngIf="sugerencias.length > 0">
      <div class="sugerencia-item" *ngFor="let s of sugerencias" (click)="irAProducto(s.id)">
        <img [src]="'/images/' + s.imagen" [alt]="s.nombre" class="sugerencia-img">
        <div class="sugerencia-info">
          <span class="sugerencia-nombre">{{ s.nombre }}</span>
          <span class="sugerencia-precio">${{ s.precio }}</span>
        </div>
      </div>
    </div>

    <p class="buscador-sin-resultados" *ngIf="query.trim() && !buscando && sugerencias.length === 0">
      Sin resultados para "{{ query }}"
    </p>
  </div>
</div>
